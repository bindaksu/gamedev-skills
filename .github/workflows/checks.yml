name: checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Validate skills
        run: python3 tools/validate.py --all skills
      - name: Leak guard (built-in patterns; the private banlist runs only in the local hook)
        run: python3 tools/leak_guard.py
      - name: Catalog is rebuilt
        run: python3 tools/build_site.py && git diff --exit-code site/index.html
